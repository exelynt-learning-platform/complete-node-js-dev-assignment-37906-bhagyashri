
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS Testing</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
        }

        pre {
            margin-top: 20px;
            padding: 15px;
            background-color: #f1f1f1;
            border-radius: 5px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <h1>CORS Testing</h1>

    <p>
        Click the button to test the Express API from this frontend.
    </p>

    <button id="testButton">Test API Request</button>

    <pre id="result">Click the button to test the API.</pre>

    <script>
        const button = document.getElementById("testButton");
        const result = document.getElementById("result");

        button.addEventListener("click", async () => {

            result.textContent = "Sending API request...";

            try {
                const response = await fetch(
                    "http://localhost:3000/api/cors-test"
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "API request failed.");
                }

                result.textContent =
                    "SUCCESS: CORS request allowed!\n\n" +
                    JSON.stringify(data, null, 2);

                console.log("API response:", data);

            } catch (error) {

                result.textContent =
                    "ERROR: CORS request blocked or failed!\n\n" +
                    error.message;

                console.error("API request failed:", error);
            }
        });
    </script>

</body>
</html>
